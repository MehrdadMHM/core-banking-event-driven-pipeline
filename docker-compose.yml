version: "3.9"

networks:
  kafka-net:
    driver: bridge

volumes:
  controller-1-data:
  controller-2-data:
  controller-3-data:
  broker-1-data:
  broker-2-data:
  broker-3-data:

services:
  # -------------------------------------------------
  # CONTROLLERS
  # -------------------------------------------------
  controller-1:
    image: docker.arvancloud.ir/apache/kafka:4.2.0
    container_name: controller-1
    networks:
      - kafka-net
    volumes:
      - controller-1-data:/var/lib/kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  controller-2:
    image: docker.arvancloud.ir/apache/kafka:4.2.0
    container_name: controller-2
    networks:
      - kafka-net
    volumes:
      - controller-2-data:/var/lib/kafka
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  controller-3:
    image: docker.arvancloud.ir/apache/kafka:4.2.0
    container_name: controller-3
    networks:
      - kafka-net
    volumes:
      - controller-3-data:/var/lib/kafka
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # -------------------------------------------------
  # BROKERS
  # -------------------------------------------------
  broker-1:
    image: docker.arvancloud.ir/apache/kafka:4.2.0
    container_name: broker-1
    networks:
      - kafka-net
    ports:
      - 29092:9092
    volumes:
      - broker-1-data:/var/lib/kafka
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-1:19092,EXTERNAL://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-2:
    image: docker.arvancloud.ir/apache/kafka:4.2.0
    container_name: broker-2
    networks:
      - kafka-net
    ports:
      - 39092:9092
    volumes:
      - broker-2-data:/var/lib/kafka
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-2:19092,EXTERNAL://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-3:
    image: docker.arvancloud.ir/apache/kafka:4.2.0
    container_name: broker-3
    networks:
      - kafka-net
    ports:
      - 49092:9092
    volumes:
      - broker-3-data:/var/lib/kafka
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://broker-3:19092,EXTERNAL://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - controller-1
      - controller-2
      - controller-3
  # -------------------------------------------------
  # REDPANDA CONSOLE
  # -------------------------------------------------
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: redpanda-console
    networks:
      - kafka-net
    ports:
      - "8085:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers:
            - broker-1:19092
            - broker-2:19092
            - broker-3:19092
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    depends_on:
      - broker-1
      - broker-2
      - broker-3

  # -------------------------------------------------
  # KAFKA TO POSTGRESQL CONNECTOR
  # -------------------------------------------------
  kafka-to-postgres:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: kafka-to-postgres
    networks:
      - kafka-net

    environment:
      CONNECT_CONFIG: |
        input:
          kafka_franz:
            seed_brokers:
              - broker-1:19092
              - broker-2:19092
              - broker-3:19092
            topics:
              - core.transactions
              - core.payments
              - core.credit
            consumer_group: postgres-raw-writer-v2
            start_offset: earliest

        output:
          sql_raw:
            driver: postgres
            dsn: postgres://airflow:airflow@host.docker.internal:5432/kafka_events?sslmode=disable
            query: |
              INSERT INTO public.raw_events
              (
                event_id,
                event_type,
                payload,
                kafka_topic,
                partition_id,
                kafka_offset
              )
              VALUES ($1, $2, $3::jsonb, $4, $5, $6)
              ON CONFLICT (kafka_topic, partition_id, kafka_offset)
              DO NOTHING
            args_mapping: |
              root = [
                this.event_id.string(),
                this.event_type,
                content().string(),
                meta("kafka_topic"),
                meta("kafka_partition").number(),
                meta("kafka_offset").number()
              ]

    entrypoint: /bin/sh
    command: -c 'echo "$$CONNECT_CONFIG" > /tmp/connect.yml && /redpanda-connect -c /tmp/connect.yml'

    depends_on:
      - broker-1
      - broker-2
      - broker-3